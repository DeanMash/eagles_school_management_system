<!DOCTYPE html>
<html>
<head>
    <title>Test Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h1>Test Bootstrap Modal</h1>
    
    <!-- Test Button -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#testModal">
        Click Me - This Should Open Modal
    </button>
    
    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    If you can see this, Bootstrap is working!
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        console.log('Test page loaded');
        console.log('Bootstrap loaded:', typeof bootstrap !== 'undefined');
        
        // Test manual modal open
        setTimeout(function() {
            var modal = new bootstrap.Modal(document.getElementById('testModal'));
            modal.show();
            console.log('Modal shown programmatically');
        }, 1000);
    </script>
</body>
</html>
